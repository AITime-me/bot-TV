x-runtime-environment: &runtime-environment
  BOT_MODE: ${BOT_MODE:-OFF}
  EMERGENCY_LOCK: ${EMERGENCY_LOCK:-true}
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  HANDOFF_PAUSE_SECONDS: ${HANDOFF_PAUSE_SECONDS:-900}
  HANDOFF_EXPIRY_POLL_SECONDS: ${HANDOFF_EXPIRY_POLL_SECONDS:-1}
  WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-1}
  WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:-100}
  WORKER_TICK_TIMEOUT_SECONDS: ${WORKER_TICK_TIMEOUT_SECONDS:-20}
  WORKER_HEARTBEAT_INTERVAL_SECONDS: ${WORKER_HEARTBEAT_INTERVAL_SECONDS:-10}
  WORKER_HEARTBEAT_STALE_SECONDS: ${WORKER_HEARTBEAT_STALE_SECONDS:-45}
  WORKER_MAX_CONSECUTIVE_FAILURES: ${WORKER_MAX_CONSECUTIVE_FAILURES:-3}

x-runtime-hardening: &runtime-hardening
  read_only: true
  init: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:size=32m,mode=1777

services:
  migrate:
    build:
      context: .
    command: ["alembic", "upgrade", "head"]
    environment: *runtime-environment
    <<: *runtime-hardening
    restart: "no"

  api:
    build:
      context: .
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment: *runtime-environment
    <<: *runtime-hardening
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "app.http_healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build:
      context: .
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *runtime-environment
      WORKER_INSTANCE_ID: bot-tv-worker
    <<: *runtime-hardening
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker_healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
