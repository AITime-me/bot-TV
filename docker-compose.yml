x-runtime-environment: &runtime-environment
  BOT_MODE: ${BOT_MODE:-OFF}
  EMERGENCY_LOCK: ${EMERGENCY_LOCK:-true}
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  HANDOFF_PAUSE_SECONDS: ${HANDOFF_PAUSE_SECONDS:-900}
  HANDOFF_EXPIRY_POLL_SECONDS: ${HANDOFF_EXPIRY_POLL_SECONDS:-1}
  WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-1}
  WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:-100}
  WORKER_TICK_TIMEOUT_SECONDS: ${WORKER_TICK_TIMEOUT_SECONDS:-20}
  WORKER_HEARTBEAT_INTERVAL_SECONDS: ${WORKER_HEARTBEAT_INTERVAL_SECONDS:-10}
  WORKER_HEARTBEAT_STALE_SECONDS: ${WORKER_HEARTBEAT_STALE_SECONDS:-45}
  WORKER_MAX_CONSECUTIVE_FAILURES: ${WORKER_MAX_CONSECUTIVE_FAILURES:-3}

x-runtime-hardening: &runtime-hardening
  read_only: true
  init: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:size=32m,mode=1777

services:
  migrate:
    build:
      context: .
    command: ["alembic", "upgrade", "head"]
    environment: *runtime-environment
    <<: *runtime-hardening
    restart: "no"

  api:
    build:
      context: .
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment: *runtime-environment
    <<: *runtime-hardening
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "app.http_healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build:
      context: .
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *runtime-environment
      WORKER_INSTANCE_ID: bot-tv-worker
    <<: *runtime-hardening
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker_healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Default-off: not started by `docker compose up -d`.
  # Activation requires profile `attachment-maintenance` AND
  # ATTACHMENT_MAINTENANCE_ENABLED=true plus a host-local keyring env_file.
  # Keyring vars must come only from env_file (not service environment).
  attachment-maintenance:
    build:
      context: .
    command: ["python", "-B", "-m", "app.attachment_maintenance"]
    profiles: ["attachment-maintenance"]
    environment:
      <<: *runtime-environment
      ATTACHMENT_MAINTENANCE_ENABLED: ${ATTACHMENT_MAINTENANCE_ENABLED:-false}
      ATTACHMENT_MAINTENANCE_INTERVAL_SECONDS: ${ATTACHMENT_MAINTENANCE_INTERVAL_SECONDS:-60}
      ATTACHMENT_MAINTENANCE_INITIAL_DELAY_SECONDS: ${ATTACHMENT_MAINTENANCE_INITIAL_DELAY_SECONDS:-0}
      ATTACHMENT_MAINTENANCE_HEARTBEAT_STALE_SECONDS: ${ATTACHMENT_MAINTENANCE_HEARTBEAT_STALE_SECONDS:-180}
      ATTACHMENT_RECONCILE_BATCH_LIMIT: ${ATTACHMENT_RECONCILE_BATCH_LIMIT:-100}
      ATTACHMENT_PURGE_BATCH_LIMIT: ${ATTACHMENT_PURGE_BATCH_LIMIT:-100}
      ATTACHMENT_SPOOL_ROOT: ${ATTACHMENT_SPOOL_ROOT:-/var/lib/bot-tv/attachment-spool}
      ATTACHMENT_SPOOL_TTL_SECONDS: ${ATTACHMENT_SPOOL_TTL_SECONDS:-900}
    env_file:
      - path: ${ATTACHMENT_SPOOL_KEYS_ENV_FILE:-/etc/bot-tv/attachment-spool-keys.env}
        required: false
    <<: *runtime-hardening
    volumes:
      - attachment-spool:/var/lib/bot-tv/attachment-spool
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-B",
          "-m",
          "app.attachment_maintenance_healthcheck",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s

volumes:
  attachment-spool:
