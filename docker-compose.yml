x-runtime-environment: &runtime-environment
  BOT_MODE: ${BOT_MODE:-OFF}
  EMERGENCY_LOCK: ${EMERGENCY_LOCK:-true}
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  HANDOFF_PAUSE_SECONDS: ${HANDOFF_PAUSE_SECONDS:-900}
  HANDOFF_EXPIRY_POLL_SECONDS: ${HANDOFF_EXPIRY_POLL_SECONDS:-1}
  WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-1}
  WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:-100}
  WORKER_TICK_TIMEOUT_SECONDS: ${WORKER_TICK_TIMEOUT_SECONDS:-20}
  WORKER_HEARTBEAT_INTERVAL_SECONDS: ${WORKER_HEARTBEAT_INTERVAL_SECONDS:-10}
  WORKER_HEARTBEAT_STALE_SECONDS: ${WORKER_HEARTBEAT_STALE_SECONDS:-45}
  WORKER_MAX_CONSECUTIVE_FAILURES: ${WORKER_MAX_CONSECUTIVE_FAILURES:-3}
  CONTROL_PLANE_POLL_SECONDS: ${CONTROL_PLANE_POLL_SECONDS:-30}
  TEYA_REQUEST_POLL_SECONDS: ${TEYA_REQUEST_POLL_SECONDS:-5}
  TEYA_REQUEST_RECONCILIATION_POLL_SECONDS: ${TEYA_REQUEST_RECONCILIATION_POLL_SECONDS:-30}
  BOOKING_METHOD_ANALYTICS_POLL_SECONDS: ${BOOKING_METHOD_ANALYTICS_POLL_SECONDS:-30}
  ACQUISITION_SOURCE_ANALYTICS_POLL_SECONDS: ${ACQUISITION_SOURCE_ANALYTICS_POLL_SECONDS:-30}

# amoCRM feature gates for api/worker. All enable flags default false.
# Secret/key material is never inlined: CHANNEL_SECRET / CLIENT_* come from
# host env (empty default), OAuth AEAD key bytes from optional env_file only.
x-amocrm-environment: &amocrm-environment
  AMOCRM_CHAT_WEBHOOK_ENABLED: ${AMOCRM_CHAT_WEBHOOK_ENABLED:-false}
  AMOCRM_CHAT_CHANNEL_SECRET: ${AMOCRM_CHAT_CHANNEL_SECRET:-}
  AMOCRM_CHAT_EGRESS_ENABLED: ${AMOCRM_CHAT_EGRESS_ENABLED:-false}
  AMOCRM_CHAT_SCOPE_ID: ${AMOCRM_CHAT_SCOPE_ID:-}
  AMOCRM_CHAT_BOT_ID: ${AMOCRM_CHAT_BOT_ID:-}
  AMOCRM_CHAT_API_BASE_URL: ${AMOCRM_CHAT_API_BASE_URL:-https://amojo.amocrm.ru}
  AMOCRM_CLIENT_ID: ${AMOCRM_CLIENT_ID:-}
  AMOCRM_CLIENT_SECRET: ${AMOCRM_CLIENT_SECRET:-}
  AMOCRM_CRM_REST_ENABLED: ${AMOCRM_CRM_REST_ENABLED:-false}
  AMOCRM_CRM_API_BASE_URL: ${AMOCRM_CRM_API_BASE_URL:-}
  AMOCRM_CRM_REDIRECT_URI: ${AMOCRM_CRM_REDIRECT_URI:-}
  AMOCRM_CRM_CONNECTION_SCOPE: ${AMOCRM_CRM_CONNECTION_SCOPE:-default}
  AMOCRM_CRM_DEAL_CREATE_ENABLED: ${AMOCRM_CRM_DEAL_CREATE_ENABLED:-false}
  AMOCRM_CRM_DEAL_PIPELINE_ID: ${AMOCRM_CRM_DEAL_PIPELINE_ID:-}
  AMOCRM_CRM_DEAL_STATUS_ID: ${AMOCRM_CRM_DEAL_STATUS_ID:-}
  AMOCRM_CRM_OAUTH_ACTIVE_KEY_ID: ${AMOCRM_CRM_OAUTH_ACTIVE_KEY_ID:-}

# Native CRM Platform outgoing_message CAPTURE-ONLY — api only. Default-off.
# Ephemeral path_token must never be attached to worker/migrate.
x-amocrm-native-outgoing-capture-environment: &amocrm-native-outgoing-capture-environment
  AMOCRM_NATIVE_OUTGOING_CAPTURE_ENABLED: ${AMOCRM_NATIVE_OUTGOING_CAPTURE_ENABLED:-false}
  AMOCRM_NATIVE_OUTGOING_CAPTURE_PATH_TOKEN: ${AMOCRM_NATIVE_OUTGOING_CAPTURE_PATH_TOKEN:-}
  AMOCRM_NATIVE_OUTGOING_CAPTURE_TALK_ID: ${AMOCRM_NATIVE_OUTGOING_CAPTURE_TALK_ID:-}
  AMOCRM_NATIVE_OUTGOING_CAPTURE_CHAT_ID: ${AMOCRM_NATIVE_OUTGOING_CAPTURE_CHAT_ID:-}
  AMOCRM_NATIVE_OUTGOING_CAPTURE_CONTACT_ID: ${AMOCRM_NATIVE_OUTGOING_CAPTURE_CONTACT_ID:-}
  AMOCRM_NATIVE_OUTGOING_CAPTURE_ORIGIN: ${AMOCRM_NATIVE_OUTGOING_CAPTURE_ORIGIN:-}
  AMOCRM_NATIVE_OUTGOING_CAPTURE_SOURCE_ID: ${AMOCRM_NATIVE_OUTGOING_CAPTURE_SOURCE_ID:-}

x-amocrm-oauth-keys-env-file: &amocrm-oauth-keys-env-file
  - path: ${AMOCRM_CRM_OAUTH_KEYS_ENV_FILE:-/etc/bot-tv/amocrm-crm-oauth-keys.env}
    required: false

# YandexGPT shadow draft — worker only. Default-off / fail-closed.
# Never attach this anchor to api/migrate: credentials stay off the API surface.
# Optional numeric/base vars use explicit defaults (empty string != absent in
# YandexLlmConfig.from_env and would fail closed when LLM is enabled).
x-yandex-shadow-environment: &yandex-shadow-environment
  YANDEX_LLM_ENABLED: ${YANDEX_LLM_ENABLED:-false}
  YANDEX_API_KEY: ${YANDEX_API_KEY:-}
  YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID:-}
  YANDEX_SHADOW_DRAFT_ENABLED: ${YANDEX_SHADOW_DRAFT_ENABLED:-false}
  YANDEX_SHADOW_ALLOW_UNDER_EMERGENCY_LOCK: ${YANDEX_SHADOW_ALLOW_UNDER_EMERGENCY_LOCK:-false}
  YANDEX_MODEL_URI: ${YANDEX_MODEL_URI:-}
  YANDEX_LLM_API_BASE_URL: ${YANDEX_LLM_API_BASE_URL:-https://llm.api.cloud.yandex.net}
  YANDEX_LLM_TIMEOUT_SECONDS: ${YANDEX_LLM_TIMEOUT_SECONDS:-15.0}
  YANDEX_LLM_MAX_RESPONSE_BYTES: ${YANDEX_LLM_MAX_RESPONSE_BYTES:-65536}
  YANDEX_LLM_TEMPERATURE: ${YANDEX_LLM_TEMPERATURE:-0.3}
  YANDEX_LLM_MAX_TOKENS: ${YANDEX_LLM_MAX_TOKENS:-1024}

# VK CLIENT shadow Callback — api only. Default-off / fail-closed.
# Never attach callback secrets to worker.
# Separate from VK_MASTER_* (master command channel).
x-vk-client-environment: &vk-client-environment
  VK_CLIENT_CALLBACK_ENABLED: ${VK_CLIENT_CALLBACK_ENABLED:-false}
  VK_CLIENT_GROUP_ID: ${VK_CLIENT_GROUP_ID:-}
  VK_CLIENT_CALLBACK_SECRET: ${VK_CLIENT_CALLBACK_SECRET:-}
  VK_CLIENT_CONFIRMATION: ${VK_CLIENT_CONFIRMATION:-}

# VK CLIENT outbound closed proof — worker only (send token). Default-off.
x-vk-client-outbound-environment: &vk-client-outbound-environment
  VK_CLIENT_GROUP_ID: ${VK_CLIENT_GROUP_ID:-}
  VK_CLIENT_OUTBOUND_ENABLED: ${VK_CLIENT_OUTBOUND_ENABLED:-false}
  VK_CLIENT_ACCESS_TOKEN: ${VK_CLIENT_ACCESS_TOKEN:-}
  VK_CLIENT_OUTBOUND_ALLOW_CONVERSATION: ${VK_CLIENT_OUTBOUND_ALLOW_CONVERSATION:-}
  VK_CLIENT_OUTBOUND_PROOF_ENABLED: ${VK_CLIENT_OUTBOUND_PROOF_ENABLED:-false}
  VK_CLIENT_OUTBOUND_PROOF_TRIGGER: ${VK_CLIENT_OUTBOUND_PROOF_TRIGGER:-}
  VK_CLIENT_OUTBOUND_PROOF_REPLY: ${VK_CLIENT_OUTBOUND_PROOF_REPLY:-}
  VK_CLIENT_OUTBOUND_PROVENANCE_KEY: ${VK_CLIENT_OUTBOUND_PROVENANCE_KEY:-}
  VK_CLIENT_API_VERSION: ${VK_CLIENT_API_VERSION:-5.199}
  VK_CLIENT_API_BASE_URL: ${VK_CLIENT_API_BASE_URL:-https://api.vk.com}
  VK_CLIENT_EXTERNAL_TAKEOVER_MODE: ${VK_CLIENT_EXTERNAL_TAKEOVER_MODE:-OFF}
  VK_CLIENT_EXTERNAL_TAKEOVER_ALLOWLIST: ${VK_CLIENT_EXTERNAL_TAKEOVER_ALLOWLIST:-}

x-runtime-hardening: &runtime-hardening
  read_only: true
  init: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:size=32m,mode=1777

services:
  migrate:
    build:
      context: .
    command: ["alembic", "upgrade", "head"]
    environment: *runtime-environment
    <<: *runtime-hardening
    restart: "no"

  api:
    build:
      context: .
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      <<:
        [
          *runtime-environment,
          *amocrm-environment,
          *vk-client-environment,
          *amocrm-native-outgoing-capture-environment,
        ]
    env_file: *amocrm-oauth-keys-env-file
    <<: *runtime-hardening
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "app.http_healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build:
      context: .
    command: ["python", "-m", "app.worker"]
    environment:
      <<: [*runtime-environment, *amocrm-environment, *yandex-shadow-environment, *vk-client-outbound-environment]
      WORKER_INSTANCE_ID: bot-tv-worker
    env_file: *amocrm-oauth-keys-env-file
    <<: *runtime-hardening
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker_healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  # One-shot only. This profile is never part of ordinary api/worker startup;
  # an operator must explicitly invoke `docker compose run --rm
  # controlled-revision controlled-revision ...`.
  controlled-revision:
    build:
      context: .
      dockerfile: Dockerfile.controlled-revision
    profiles: ["controlled-revision"]
    entrypoint: ["python", "-B", "-m", "app.amocrm_crm_ops"]
    environment:
      <<: [*runtime-environment, *amocrm-environment]
    env_file: *amocrm-oauth-keys-env-file
    <<: *runtime-hardening
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  # Default-off: not started by `docker compose up -d`.
  # Activation requires profile `attachment-maintenance` AND
  # ATTACHMENT_MAINTENANCE_ENABLED=true plus a host-local keyring env_file.
  # Keyring vars must come only from env_file (not service environment).
  attachment-maintenance:
    build:
      context: .
    command: ["python", "-B", "-m", "app.attachment_maintenance"]
    profiles: ["attachment-maintenance"]
    environment:
      <<: *runtime-environment
      ATTACHMENT_MAINTENANCE_ENABLED: ${ATTACHMENT_MAINTENANCE_ENABLED:-false}
      ATTACHMENT_MAINTENANCE_INTERVAL_SECONDS: ${ATTACHMENT_MAINTENANCE_INTERVAL_SECONDS:-60}
      ATTACHMENT_MAINTENANCE_INITIAL_DELAY_SECONDS: ${ATTACHMENT_MAINTENANCE_INITIAL_DELAY_SECONDS:-0}
      ATTACHMENT_MAINTENANCE_HEARTBEAT_STALE_SECONDS: ${ATTACHMENT_MAINTENANCE_HEARTBEAT_STALE_SECONDS:-180}
      ATTACHMENT_RECONCILE_BATCH_LIMIT: ${ATTACHMENT_RECONCILE_BATCH_LIMIT:-100}
      ATTACHMENT_PURGE_BATCH_LIMIT: ${ATTACHMENT_PURGE_BATCH_LIMIT:-100}
      ATTACHMENT_SPOOL_ROOT: ${ATTACHMENT_SPOOL_ROOT:-/var/lib/bot-tv/attachment-spool}
      ATTACHMENT_SPOOL_TTL_SECONDS: ${ATTACHMENT_SPOOL_TTL_SECONDS:-900}
    env_file:
      - path: ${ATTACHMENT_SPOOL_KEYS_ENV_FILE:-/etc/bot-tv/attachment-spool-keys.env}
        required: false
    <<: *runtime-hardening
    volumes:
      - attachment-spool:/var/lib/bot-tv/attachment-spool
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-B",
          "-m",
          "app.attachment_maintenance_healthcheck",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s

volumes:
  attachment-spool:
