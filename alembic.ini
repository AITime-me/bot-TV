# Alembic config for Bot Core PostgreSQL migrations.
# DATABASE_URL must be provided via environment for upgrade/downgrade.
# Do not put credentials in this file — env.py loads Settings.from_env().

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
version_path_separator = os

# Placeholder only; always overridden from Settings in alembic/env.py.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
